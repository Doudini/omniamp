# Build and test on every push and pull request. The package is in the Swift 6 language mode, so a data race
# is a compile error: the build step checks for them.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      - name: Build
        run: swift build
      - name: Test
        # Same test settings as locally: a throwaway cache, no autoplay, muted, the test Keychain entries.
        env:
          OMNIAMP_CACHE_DIR: ${{ runner.temp }}/omniamp-cache
          OMNIAMP_NO_AUTOPLAY: "1"
          OMNIAMP_VOLUME: "0"
          OMNIAMP_KEYCHAIN_SERVICE: OmniAmpTest
        run: swift test
      - name: Release build
        run: swift build -c release

